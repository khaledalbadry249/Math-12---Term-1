#app{max-width:760px;margin:0 auto;padding:14px 12px 40px}
.card{background:var(--c);border:2px solid var(--b);border-radius:18px;padding:14px;margin-bottom:12px;backdrop-filter:blur(2px)}
h1{margin:0 0 4px;font-size:1.5rem;color:var(--a)}h2,h3{margin:6px 0;color:var(--a)}.sub{margin:0 0 8px;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
button{font-family:inherit;cursor:pointer;color:var(--t)}
.lb{background:var(--h);border:2px solid var(--b);border-radius:14px;padding:10px;text-align:right;font-size:.95rem;font-weight:800}
.lb small{display:block;font-weight:500;margin-top:4px}.lb:hover,.op:hover:not(:disabled){border-color:var(--a)}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:800;font-size:.9rem}
.sm{border:2px solid var(--b);background:var(--h);border-radius:10px;padding:4px 10px}
.bar{height:8px;background:var(--b);border-radius:9px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}
.cnt{margin:0;font-size:.85rem}
.q{font-size:1.15rem;line-height:2.1;font-weight:800;padding:10px 4px;overflow-x:auto}
math{font-size:1.3em;font-family:"Cambria Math","STIX Two Math","Latin Modern Math",serif}
mjx-assistive-mml{display:none!important}mjx-container{font-size:120%!important;margin:0 .1em!important}.q mjx-container{font-size:135%!important}.opts{display:grid;gap:8px}
.op{display:flex;align-items:center;gap:10px;background:var(--h);border:2px solid var(--b);border-radius:14px;padding:10px;font-size:1.05rem;text-align:right;overflow-x:auto}
.ch{min-width:30px;height:30px;border-radius:50%;background:var(--a);color:#fff;display:grid;place-items:center;font-weight:800}
.op.ok{background:var(--ok);border-color:var(--ok);color:#fff}.op.no{background:var(--no);border-color:var(--no);color:#fff;animation:sh .4s}
@keyframes sh{25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
.fb{margin-top:10px;border-radius:14px;padding:10px;border:2px solid;line-height:2}.fb.g{border-color:var(--ok)}.fb.r{border-color:var(--no)}.fb p{margin:4px 0}
.nx{background:var(--a);color:#fff;border:0;border-radius:12px;padding:8px 18px;font-weight:800;font-size:1rem}
#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
.big{font-size:2.4rem;text-align:center;margin:6px}.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.fg{display:block;margin:10px auto;width:100%;height:auto;direction:ltr;font-family:"Times New Roman",serif;overflow:visible}.fg text{fill:var(--t)}
.gopt{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.gopt .op{flex-direction:column;align-items:center;gap:6px;padding:8px}.gopt .fg{margin:0;background:var(--h);border-radius:10px;max-width:150px}.gopt .op.ok .fg,.gopt .op.no .fg{background:var(--h)}
.tb{border-collapse:collapse;margin:8px auto}.tb td,.tb th{border:2px solid var(--b);padding:4px 16px;text-align:center;font-size:1rem}

:root[data-th=blue]{--c:rgba(255,255,255,.8);--t:#12263f;--a:#1d4e89;--b:#b9c9de;--h:#eef4fc}
:root[data-th=green]{--c:rgba(244,252,247,.8);--t:#0f3324;--a:#1b7a4e;--b:#a9d3bd;--h:#e6f6ed}
:root[data-th=violet]{--c:rgba(248,244,255,.8);--t:#2a1b4a;--a:#6a45b5;--b:#cdbfe8;--h:#efe9fb}
:root[data-th=gold]{--c:rgba(255,250,239,.82);--t:#3b2a0e;--a:#a8690f;--b:#e3cd9d;--h:#fbf2dc}
:root[data-th=rose]{--c:rgba(255,245,248,.8);--t:#40152a;--a:#b0386b;--b:#ecc0d2;--h:#fdeaf1}
:root[data-th=night]{--c:rgba(14,22,40,.84);--t:#eef3fa;--a:#8fc1ff;--b:#3b4d66;--h:#1b2b45}
#st{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#cf{z-index:50}
#app{position:relative;z-index:1;padding-top:66px;padding-bottom:92px}
#hd{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;display:grid;grid-template-columns:auto 1fr auto;align-items:center;padding:6px 10px;pointer-events:none}
#hd>*{pointer-events:auto}.hb{display:flex;gap:6px}
.ic{width:34px;height:34px;position:relative;border-radius:50%;border:2px solid var(--b);background:var(--h);color:var(--t);font-size:1.1rem;display:grid;place-items:center;padding:0}
.ic svg{width:60%;height:60%;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ic.dot::after{content:"";position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:#e02424;border:2px solid #fff;animation:ep 1s infinite}
#logo{justify-self:center;border:2px solid rgba(255,255,255,.75);border-radius:999px;background:linear-gradient(135deg,#1d4e89,#7b3fb8,#d4871a);padding:9px 26px;font-weight:800;font-size:.95rem;color:#fff;cursor:pointer;font-family:inherit;text-shadow:0 1px 3px rgba(0,0,0,.5);box-shadow:0 0 16px rgba(255,255,255,.55),0 3px 10px rgba(0,0,0,.35);animation:lg 2.4s ease-in-out infinite;white-space:nowrap}
@keyframes lg{0%,100%{transform:scale(1.12)}50%{transform:scale(.86)}}
@media(max-width:480px){.ic{width:30px;height:30px;font-size:1rem}.hb{gap:4px}#logo{padding:7px 14px;font-size:.8rem}#hd{padding:6px 6px}}
@media(max-width:400px){.ic{width:28px;height:28px;font-size:.9rem}#logo{padding:6px 11px;font-size:.74rem}}
#pp{position:fixed;top:56px;right:10px;z-index:25;display:none;gap:6px;background:var(--h);border:2px solid var(--b);border-radius:14px;padding:8px}#pp.o{display:grid}
.sw{display:flex;align-items:center;gap:8px;background:var(--c);border:2px solid var(--b);border-radius:10px;padding:4px 12px;font-weight:800;font-size:.9rem}.sw i{width:16px;height:16px;border-radius:50%;display:inline-block}
#nv{position:fixed;bottom:0;left:0;right:0;z-index:20;display:none;gap:6px;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--h);border-top:2px solid var(--b)}
.nb{flex:1;max-width:170px;border:2px solid var(--b);background:var(--c);border-radius:12px;padding:9px 4px;font-weight:800;font-size:.9rem}.nb:disabled{opacity:.4}
.nb:last-child{background:var(--a);color:#fff;border-color:var(--a)}
.verse{margin:8px auto 14px;padding:22px 22px;max-width:560px;text-align:center;font-family:'Amiri Quran','Scheherazade New',serif;font-size:1.55rem;line-height:2.3;color:#fff6d6;border-radius:46px;background:radial-gradient(ellipse at center,rgba(20,40,85,.9),rgba(14,28,60,.78));animation:vs 3.4s ease-in-out infinite,gl 2.2s ease-in-out infinite alternate}
@keyframes vs{0%,100%{transform:scale(.94)}50%{transform:scale(1.05)}}
@keyframes gl{from{box-shadow:0 0 12px rgba(255,215,120,.35);text-shadow:0 0 6px rgba(255,215,120,.4)}to{box-shadow:0 0 44px rgba(255,215,120,.9);text-shadow:0 0 18px rgba(255,232,150,1)}}
.enter{background:linear-gradient(135deg,var(--a),#d4871a);color:#fff;border:0;border-radius:40px;padding:14px 34px;font-size:1.25rem;font-weight:800;margin:10px 0;box-shadow:0 6px 18px rgba(0,0,0,.3);animation:ep 1.8s ease-in-out infinite}
@keyframes ep{50%{transform:scale(1.06)}}
.msg{font-size:1.1rem;font-weight:800;margin:2px 0 6px}
#ubn{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:24;display:none;background:#e02424;color:#fff;font-weight:800;border-radius:30px;padding:8px 18px;font-size:.9rem;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer;white-space:nowrap;animation:ep 1.4s infinite}
#tt{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:60;background:#12263f;color:#fff;border-radius:14px;padding:10px 18px;font-weight:800;display:none;max-width:88vw;text-align:center}
#md{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:14px}
.mc{background:var(--h);color:var(--t);border:2px solid var(--b);border-radius:18px;padding:16px;max-width:380px;width:100%;text-align:center;display:grid;gap:10px}.mc h2{margin:0}
.mc input{width:100%;border:2px solid var(--b);border-radius:10px;padding:8px;font-family:inherit;background:var(--c);color:var(--t)}#qr{display:flex;justify-content:center;min-height:60px}#qr>div,#qr img,#qr canvas{background:#fff;padding:8px;border-radius:10px}

.cp{border:2px solid var(--b);background:var(--h);border-radius:20px;padding:6px 14px;font-weight:800;font-size:.95rem}.cp.on{background:var(--a);color:#fff;border-color:var(--a)}
.tk{display:flex;gap:8px;align-items:center;background:var(--h);border:2px solid var(--b);border-radius:12px;padding:8px;font-weight:800;font-size:.9rem;cursor:pointer}.tk.on{border-color:var(--a)}.tk input{width:18px;height:18px;accent-color:var(--a)}
.ni{width:80px;text-align:center;font-family:inherit;font-weight:800;font-size:1.1rem;border:2px solid var(--b);border-radius:10px;padding:6px;background:var(--c);color:var(--t)}
.qbtn{background:linear-gradient(135deg,#17894a,#1d4e89)}.qbtn:disabled{opacity:.4;animation:none}

#1-1¦النهايات
T¦في الرسم البياني أدناه: $\displaystyle\lim_{x\to3^-}f(x)=-2$ {{f:g11a}}¦0¦عندما $x\to3^-$ (من اليسار) نتتبع الخط الأفقي عند $y=3$ فالنهاية $3$ وليست $-2$ (والعدد $-2$ هو نهاية الدالة من اليمين)
T¦$\displaystyle\lim_{y\to2}\frac{y^2+5y+6}{y+2}=5$¦1¦بالتعويض المباشر: $\frac{4+10+6}{2+2}=5$
T¦$\displaystyle\lim_{x\to0}\frac{5x^3+8x^2}{3x^4-16x^2}=0$¦0¦نختصر $x^2$ فيكون الناتج $\frac{8}{-16}=-\frac12$ وليس صفرًا
T¦$\displaystyle\lim_{x\to0^-}\frac{\sqrt{x^2}-x}{x}=-2$¦1¦عندما $x\to0^-$: $\sqrt{x^2}=-x$ فالناتج $\frac{-x-x}{x}=-2$
T¦$\displaystyle\lim_{x\to1^+}(2x-|x|+2)=3$¦1¦$|x|=x$ فتصبح $x+2$ والناتج $3$
M¦الشكل المقابل هو بيان الدالة $f$. العبارة الصحيحة فيما يلي هي: {{f:g11b}}¦$\displaystyle\lim_{x\to0^-}f(x)=4$;;$\displaystyle\lim_{x\to0^-}f(x)=-3$;;$\displaystyle\lim_{x\to0^+}f(x)=4$;;$\displaystyle\lim_{x\to0}f(x)=-3$¦0¦عندما $x\to0^-$ نسير على الجزء الأيسر من البيان (المستقيم المار بالنقطتين $(-4,0)$ و $(0,4)$) فتقترب $f(x)$ من $4$؛ أما من اليمين فالنهاية $-3$ وعليه فالنهاية الكلية غير موجودة
M¦$\displaystyle\lim_{x\to-2}(x^3+3x^2-2x-17)=$¦$17$;;$-17$;;$9$;;$-9$¦3¦$-8+12+4-17=-9$
M¦$\displaystyle\lim_{x\to1}\frac{x-1}{x^2-1}=$¦$1$;;$0$;;$\frac12$;;غير موجودة¦2¦$\frac{x-1}{(x-1)(x+1)}=\frac1{x+1}=\frac12$
M¦$\displaystyle\lim_{x\to2}\frac{x^2-3x+2}{2x^2-5x+2}=$¦$1$;;$0$;;$\frac12$;;$\frac13$¦3¦$\frac{(x-2)(x-1)}{(2x-1)(x-2)}=\frac{x-1}{2x-1}=\frac13$
M¦$\displaystyle\lim_{x\to1}\frac{\sqrt x-1}{x-1}=$¦$-1$;;$1$;;$\frac12$;;$0$¦2¦بالضرب في المرافق: $\frac1{\sqrt x+1}=\frac12$
M¦$\displaystyle\lim_{x\to2^+}\frac{|x-2|}{x^2-4}=$¦$\frac12$;;$-\frac12$;;$\frac14$;;$-\frac14$¦2¦$|x-2|=x-2$ فيصبح $\frac1{x+2}=\frac14$
M¦$\displaystyle\lim_{x\to0}\frac{\frac1{2+x}-\frac12}{x}=$¦$-\frac12$;;$\frac12$;;$\frac14$;;$-\frac14$¦3¦$\frac{-x}{2(2+x)}\cdot\frac1x=\frac{-1}{2(2+x)}=-\frac14$
M¦$\displaystyle\lim_{x\to-8}\frac{x+8}{\sqrt[3]x+2}=$¦$12$;;$-12$;;$4$;;$-4$¦0¦$x+8=(\sqrt[3]x+2)(\sqrt[3]{x^2}-2\sqrt[3]x+4)$ فالناتج $4+4+4=12$
M¦$\displaystyle\lim_{x\to-3}\frac{2x^3+9x^2+9x}{x+3}=$¦$9$;;$0$;;$-3$;;$-9$¦0¦$\frac{x(x+3)(2x+3)}{x+3}=x(2x+3)=9$
#1-2¦نهايات تشتمل على ∞ و −∞
T¦$\displaystyle\lim_{x\to\infty}\frac{2x-1}{|x|-3}=2$¦1¦$|x|=x$ عندما $x\to\infty$، ودرجة البسط = درجة المقام فالناتج $2$
T¦$\displaystyle\lim_{x\to-\infty}\frac{|x|-3}{x+3}=-1$¦1¦عندما $x\to-\infty$: $|x|=-x$ ودرجة البسط = درجة المقام فالناتج $-1$
T¦$\displaystyle\lim_{x\to\infty}\frac{1-x}{2x^2-5x-3}=-\infty$¦0¦درجة البسط أصغر من درجة المقام، الناتج = 0
T¦$\displaystyle\lim_{x\to-\infty}\frac{x}{|2x-3|}=\frac12$¦0¦عندما $x\to-\infty$: $|2x-3|=-2x+3$ فالناتج $-\frac12$
M¦$\displaystyle\lim_{x\to\infty}\frac{|x|}{|x|+1}=$¦$0$;;$1$;;$\infty$;;$\frac12$¦1¦$|x|=x$ ودرجة البسط = درجة المقام ⇒ $1$
M¦$\displaystyle\lim_{x\to\infty}\frac{x}{x+3}=$¦$\infty$;;$-\infty$;;$1$;;$0$¦2¦درجة البسط = درجة المقام ⇒ $1$
M¦$\displaystyle\lim_{x\to-\infty}\frac{3x-5}{\sqrt{x^2+1}}=$¦$\infty$;;$-\infty$;;$3$;;$-3$¦3¦عندما $x\to-\infty$: $\sqrt{x^2}=|x|=-x$ فالناتج $\frac3{-1}=-3$
M¦$\displaystyle\lim_{x\to-\infty}\left(\frac2x+1\right)\left(\frac{5x^2-1}{x^2}\right)=$¦$0$;;$5$;;$1$;;$-\infty$¦1¦$\lim\left(\frac2x+1\right)\cdot\lim\frac{5x^2-1}{x^2}=1\times5=5$
#1-3¦صيغ غير معينة
T¦$\displaystyle\lim_{x\to\infty}(3x^2+7x-8)=\infty$¦1¦لأن $\lim 3x^2=\infty$
T¦$\displaystyle\lim_{x\to-\infty}(-x^3-2x+1)=-\infty$¦0¦عندما $x\to-\infty$ فإن $\lim(-x^3)=+\infty$
T¦$\displaystyle\lim_{x\to-\infty}(-x^2+x-3)=-\infty$¦1¦لأن $\lim(-x^2)=-\infty$
T¦$\displaystyle\lim_{x\to\infty}\frac{-2x+4}{3x^2-5x+1}=0$¦1¦درجة البسط أصغر من درجة المقام، الناتج = 0
T¦$\displaystyle\lim_{x\to-\infty}\frac{4x^3+7x^2-1}{2x^3-4}=2$¦1¦درجة البسط = درجة المقام: $\frac42=2$
T¦$\displaystyle\lim_{x\to-\infty}\frac{3x-7}{\sqrt{4x^2-8x+5}}=\frac32$¦0¦$\sqrt{x^2}=-x$ عندما $x\to-\infty$ فالناتج $-\frac32$
M¦$\displaystyle\lim_{x\to\infty}\frac{x^3-2x+5}{2x^4+x^2-2}=$¦$\infty$;;$\frac12$;;$0$;;$-\infty$¦2¦درجة البسط أصغر من درجة المقام ⇒ $0$
M¦$\displaystyle\lim_{x\to\infty}\frac{-5x+3}{\sqrt{9x^2-2x+4}}=$¦$\frac53$;;$-\frac53$;;$\frac59$;;$-\frac59$¦1¦$\frac{-5}{\sqrt9}=-\frac53$
M¦$\displaystyle\lim_{x\to-\infty}\frac{-2x+1}{\sqrt{4x^2-x+3}}=$¦$-1$;;$-\frac12$;;$\frac12$;;$1$¦3¦$\sqrt{x^2}=-x$ فالناتج $\frac{-2}{-\sqrt4}=1$
M¦إذا كان $\displaystyle\lim_{x\to\infty}\frac{mx^2+nx+4}{\sqrt{x^2-2x+4}}=-2$ فإن $m,n$:¦$m=0,n=-2$;;$m=0,n=2$;;$m=1,n=-1$;;$m=1,n=1$¦0¦درجة البسط يجب أن تكون 1 فـ $m=0$، ثم $\frac n1=-2\Rightarrow n=-2$
M¦إذا كان $\displaystyle\lim_{x\to-\infty}\frac{\sqrt{4x^2-2x+3}}{mx^2+nx-4}=1$ فإن $m,n$:¦$m=0,n=-2$;;$m=0,n=2$;;$m=0,n=4$;;$m=0,n=-4$¦0¦$m=0$ ثم $\frac{-\sqrt4}{n}=1\Rightarrow n=-2$
#1-4¦نهايات بعض الدوال المثلثية
T¦$\displaystyle\lim_{x\to0}\frac{1-\sin x}{\cos^2x}=0$¦0¦نهاية المقام $=1\neq0$ والناتج $\frac{1-0}{1}=1$
T¦$\displaystyle\lim_{x\to0}\frac{1+\sin2x}{2\cos2x}=\frac12$¦1¦نهاية المقام $2\ne0$ والناتج $\frac{1+0}{2\times1}=\frac12$
M¦$\displaystyle\lim_{x\to0}\frac{\tan2x}{\sin x}=$¦$2$;;$-2$;;$0$;;$\infty$¦0¦نقسم البسط والمقام على $x$ فالناتج $\frac21=2$
M¦$\displaystyle\lim_{x\to0}\frac{4x^2+5\sin^2x}{3x^2}=$¦$3$;;$9$;;$0$;;$\infty$¦0¦$\frac43+\frac53\cdot1=3$
#1-5¦الاتّصال
T¦الدالة $f(x)=\frac1{(x+2)^2}+1$ متصلة عند $x=-2$¦0¦أصفار المقام $-2$ فالدالة غير معرفة عند $x=-2$
T¦الدالة $y=\frac1{x^2+1}$ متصلة عند كل $x\in\mathbb R$¦1¦دالة نسبية والمقام $\neq0$ لكل $x$
T¦الدالة $y=\frac1{\sqrt{x+2}}$ متصلة عند $x=-1$¦1¦البسط ثابت والمقام جذر تربيعي متصل و $\neq0$ عند $x=-1$
T¦إذا كانت $f$ متصلة عند $x=-1$ و $\displaystyle\lim_{x\to-1}(f(x)-2)=-1$ فإن $f(-1)=1$¦1¦$\lim f(x)=1=f(-1)$ لأن النهاية = الصورة
M¦إذا كانت $f$ متصلة عند $x=-2$ و $\displaystyle\lim_{x\to-2}(x^2+f(x))=7$ فإن $f(-2)=$¦$3$;;$5$;;$9$;;$11$¦0¦النهاية = الصورة: $4+\lim f(x)=7\Rightarrow f(-2)=3$
M¦إذا كانت $g$ متصلة عند $x=1$ والنقطة $(1,-3)$ على منحناها فإن $\displaystyle\lim_{x\to1}(g(x))^2=$¦$-6$;;$-3$;;$1$;;$9$¦3¦$\lim g(x)=g(1)=-3$ فالناتج $9$

#1-6¦نظريات الاتصال
T¦الدالة $f(x)=x^2+|x-1|$ متصلة عند $x=3$¦1¦مجموع كثيرة حدود ودالة مطلق (تركيب $|u(x)|$ مع $u$ متصلة) وكلاهما متصل عند $x=3$
T¦الدالة $f(x)=\frac{2x+5}{x+2}-\frac2x$ متصلة عند $x=0$¦0¦الدالة $\frac2x$ غير متصلة عند $x=0$ فالفرق غير متصل
T¦الدالة $f(x)=\frac{2x-2}{|x|-1}$ متصلة عند $x=0$¦1¦البسط كثيرة حدود، والمقام متصل و $\neq0$ عند $x=0$
T¦الدالة $f(x)=\frac{\sqrt[3]{3x-1}}{x^2}$ متصلة عند $x=3$¦1¦البسط جذر تكعيبي متصل، والمقام كثيرة حدود متصلة و $\neq0$ عند $x=3$
T¦الدالة $f(x)=\sqrt{-x^2+5x-4}$ متصلة عند $x=2$¦1¦ما تحت الجذر عند $x=2$: $-4+10-4=2>0$ فالدالة متصلة
M¦نقاط انفصال $f(x)=\frac{-x+2}{x^2+9}$ عند:¦$3$;;$-3$;;$2$;;لا يوجد¦3¦دالة نسبية والمقام $\neq0$ لجميع الأعداد الحقيقية
M¦نقاط انفصال $f(x)=\frac{x^2-4}{x^2-1}$ عند:¦$1,-1$;;$2,-2$;;$1,2$;;$-1,-2$¦0¦المقام $=0$ عندما $x=\pm1$
M¦لتكن $f(x)=x^2+3$ ، $g(x)=\frac{x}{x-3}$ فإن $(g\circ f)(x)=$¦$\frac{4x^2-18x+27}{(x-3)^2}$;;$\frac{x^2}{x^2-3}$;;$\frac{x^2+3}{x^2}$;;$\frac{x^2}{x^2+3}$¦2¦$g(x^2+3)=\frac{x^2+3}{x^2+3-3}=\frac{x^2+3}{x^2}$
M¦لتكن $f(x)=\frac{x}{\sqrt{x-3}}$ ، $g(x)=x^2+3$ فإن $(f\circ g)(x)=$¦$\frac{x^2}{x-3}+3$;;$\frac{x}{\sqrt{x-3}}+3$;;$\frac{-(x^2+3)}{x}$;;$\frac{x^2+3}{|x|}$¦3¦$f(x^2+3)=\frac{x^2+3}{\sqrt{x^2}}=\frac{x^2+3}{|x|}$
M¦لتكن $f(x)=\sqrt{x^2+7}$ ، $g(x)=x^2-3$ فإن $(f\circ g)(0)=$¦$4$;;$-4$;;$1$;;$-1$¦0¦$f(g(0))=f(-3)=\sqrt{9+7}=4$
M¦إذا كانت $g$ دالة متصلة عند $x=2$ فالدالة المتصلة عند $x=2$ فيما يلي هي $f(x)=$¦$\sqrt{g(x)}$;;$\frac1{g(x)}$;;$\frac{g(x)}{x-2}$;;$|g(x)|$¦3¦(a) لم يُذكر أن $g(2)>0$ ، (b) لم يُذكر أن $g(2)\neq0$ ، (c) المقام $=0$ عند $x=2$ ، (d) المطلق متصل دائمًا
M¦إذا كانت $f(x)=\sqrt{x^2-a}$ متصلة عند $x=3$ فإن $a$ يمكن أن تساوي:¦$4$;;$9$;;$16$;;$25$¦0¦يجب أن يكون ما تحت الجذر موجبًا عند $x=3$: $9-4=5>0$
#1-7¦الاتّصال على فترة
T¦إذا كانت $f$ متصلة على كل من $[1,3]$ و $(3,5]$ فإن $f$ متصلة على $[1,5]$¦0¦لا بد أن نتأكد من أن $f$ متصلة عند $x=3$ من جهة اليسار
T¦الدالة $f(x)=x^2-|x|$ متصلة لكل قيم $x\in\mathbb R$¦1¦لأن $f$ ناتج طرح دالتين (كثيرة حدود ومطلق $x$) وكلاهما متصل لكل $x$
T¦الدالة $f(x)=\sqrt{x^2-4}$ متصلة على $[-2,2]$¦0¦ما تحت الجذر سالب داخل $(-2,2)$ فالدالة غير معرفة هناك

M¦الدالة $f(x)=\frac{x+1}{x-4}$:¦لها نقطتا انفصال $x=-1,x=4$;;متصلة على $(-\infty,4]$;;متصلة على مجالها;;ليس أي مما سبق¦2¦دالة نسبية متصلة على $\mathbb R-\{4\}$ أي على مجالها
M¦الدالة $f(x)=\frac{2x-1}{\sqrt{x^2-25}}$ متصلة على:¦$(-\infty,\frac12]$;;$(5,\infty)$;;$\mathbb R$;;$(-5,5)$¦1¦ما تحت الجذر موجب والمقام $\neq0$ ⇒ $(-\infty,-5)\cup(5,\infty)$ ومنها $(5,\infty)$

#2-1¦معدلات التغير وخطوط المماس
T¦ميل مماس منحنى $f$ عند $(c,f(c))$ هو $\frac{f(c+h)-f(c)}{h}$¦0¦الميل هو $\lim_{h\to0}\frac{f(c+h)-f(c)}{h}$ إن وُجدت
T¦ميل مماس منحنى $f(x)=x^2$ عند $x=-2$ هو $4$¦0¦$f'(x)=2x\Rightarrow f'(-2)=-4$

#2-2¦المشتقة
T¦إذا كانت $f(x)=3x-12$ فإن $f'(x)=3$¦1¦باستخدام قواعد الاشتقاق $f'(x)=3$

M¦منحنى الدالة $f$ في الشكل أدناه. اختر منحنى المشتقة $f'$ المناسب له: {{f:f33_14}}¦{{f:d33a}};;{{f:d33b}};;{{f:d33c}};;{{f:d33d}};;{{f:d33e}}¦0¦للدالة قمة عند $x=-1$ وقاع عند $x=1$ فالمشتقة تنعدم عندهما وهي سالبة بينهما: قطع مفتوح للأعلى جذراه $\pm1$: الرسم $a$

function cr(p){let d='M'+p[0][0]+','+p[0][1];for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2,f=n=>n.toFixed(1);d+='C'+f(p1[0]+(p2[0]-p0[0])/6)+','+f(p1[1]+(p2[1]-p0[1])/6)+' '+f(p2[0]-(p3[0]-p1[0])/6)+','+f(p2[1]-(p3[1]-p1[1])/6)+' '+p2[0]+','+p2[1]}return d}

 const cls=`fill="none" stroke-width="${o.sw||2.3}" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--a)"`;
 const mk=`${it.ar&&it.ar[0]?` marker-start="url(#${id}a)"`:''}${it.ar&&it.ar[1]?` marker-end="url(#${id}a)"`:''}`;

<div class=card><h3>3) التوقيت</h3><div class=row><button class="cp${QS.tm=='none'?' on':''}" onclick="qtm('none')">بدون توقيت</button><button class="cp${QS.tm=='total'?' on':''}" onclick="qtm('total')">توقيت كلي للاختبار</button><button class="cp${QS.tm=='per'?' on':''}" onclick="qtm('per')">توقيت لكل سؤال</button></div>${QS.tm=='none'?'':`<div class=row style="margin-top:8px">${QS.tm=='total'?chips([5,10,15,20,30,45,60],QS.min,'qv',' د'):chips([30,45,60,90,120],QS.sec,'qv',' ث')}</div><div class=row style="margin-top:8px"><button class=ic onclick=qvd(-1)>−</button><b style="min-width:90px;text-align:center">${QS.tm=='total'?QS.min+' دقيقة':QS.sec+' ثانية'}</b><button class=ic onclick=qvd(1)>+</button></div><p class=sub style="text-align:center;margin-top:6px">${QS.tm=='total'?'مقترح تقريبًا: '+Math.max(1,Math.ceil(ne*.75))+' دقيقة':'سيُنبّه عند آخر 10 ثوانٍ، وتستطيع زيادة الوقت أو إيقافه أثناء الاختبار'}</p>`}</div>
<div class=card style="text-align:center"><button class="enter qbtn" ${av?'':'disabled'} onclick=qgo()>🚀 ابدأ الاختبار</button></div>`;nv(0);keep?scrollTo(0,y):scrollTo(0,0)}
function qz(){clearInterval(QIV);const p=$('pz');p&&p.remove();QZ=null;S={};qr(0)}
function qtg(i){const s=qsel();s.has(i)?s.delete(i):s.add(i);QS.sel=[...s];qsave();qr(1)}
function qtu(a,b){const s=qsel(),all=L.slice(a,b).every((_,i)=>s.has(a+i));for(let i=a;i<b;i++)all?s.delete(i):s.add(i);QS.sel=[...s];qsave();qr(1)}
function qall(on){QS.sel=on?L.map((_,i)=>i):[];qsave();qr(1)}
function qn(v){QS.n=v>0?Math.round(v):0;qsave();qr(1)}
function qnd(d){QS.n=Math.max(1,Math.min(qav()||1,qeff()+d*(qeff()>=10&&d>0||qeff()>10&&d<0?5:1)));qsave();qr(1)}
function qtm(m){QS.tm=m;qsave();qr(1)}
function qv(v){QS[QS.tm=='total'?'min':'sec']=v;qsave();qr(1)}
function qvd(d){if(QS.tm=='total')QS.min=Math.max(1,Math.min(180,QS.min+d));else QS.sec=Math.max(10,Math.min(600,QS.sec+d*5));qsave();qr(1)}
function qmk(q,t){const o=q.o.slice(),tf=o.length==2&&o[0]=='صحيحة',lock=tf||/\([a-e]\)/.test(q.w||'')||o.some(x=>/مما سبق|ليس أي|ليس اي/.test(x));
let a=q.a;if(!lock){const ix=qshf(o.map((_,i)=>i));return{q:q.q,o:ix.map(i=>o[i]),a:ix.indexOf(q.a),w:q.w,t}}return{q:q.q,o,a,w:q.w,t}}
function qgo(){const s=[...qsel()];if(!s.length)return toast('اختر بندًا واحدًا على الأقل');qsave();
const pool=[];s.forEach(i=>L[i].q.forEach((q,k)=>pool.push({q,key:i+'-'+k,t:L[i].n+' '+L[i].t})));
const n=qeff();let fresh=pool.filter(p=>!QSEEN.has(p.key));if(!fresh.length){QSEEN.clear();fresh=pool.slice()}
const old=qshf(pool.filter(p=>QSEEN.has(p.key)));const pk=qshf(qshf(fresh).concat(old).slice(0,n));pk.forEach(p=>QSEEN.add(p.key));
clearInterval(QIV);QZ={items:pk.map(p=>qmk(p.q,p.t)),k:0,s:0,r:[],tm:QS.tm,sec:QS.sec,paused:0,t0:Date.now(),pms:0,wn:0,last:null,end:0,rem:0};
if(QZ.tm=='total')QZ.end=Date.now()+QS.min*60000;QIV=setInterval(qtick,250);qshow()}
function qshow(){const l=QZ.items,q=l[QZ.k],R=QZ.r[QZ.k],cl=j=>R?(j==q.a?' ok':j==R.j?' no':''):'',dis=R?' disabled':'';
if(QZ.tm=='per'&&!R&&!QZ.paused){QZ.end=Date.now()+QZ.sec*1000;QZ.last=null;QZ.wn=0}
A.innerHTML=`<div class=card><div class=top><span>📝 اختبر نفسك</span><span class=tmr id=qt></span><span id=scs>⭐ ${QZ.s}</span></div><div class=bar><i style="width:${(QZ.k+1)/l.length*100}%"></i></div><p class=cnt>السؤال ${QZ.k+1} من ${l.length} · ${q.t}</p><div class=q>${rt(q.q)}</div><div class="opts${q.o[0].indexOf('{{f:')>-1?' gopt':''}">${q.o.map((o,j)=>`<button class="op${cl(j)}"${dis} onclick=qpick(${j})><span class=ch>${'abcde'[j]}</span><span>${rt(o)}</span></button>`).join('')}</div><div id=fb>${R?fbH(q,R.ok,R.m,R.j):''}</div></div>`;qnv();qtick();scrollTo(0,0)}
function qnv(){const e=$('nv'),n=QZ.items.length,last=QZ.k+1>=n,t=QZ.tm!='none';e.style.display='flex';
e.innerHTML=(t?`<button class="nb sx" onclick=qpause()>⏸ إيقاف</button><button class="nb sx" onclick=qadd()>➕ ${QZ.tm=='per'?'15 ث':'دقيقة'}</button>`:'')+(QZ.tm!='per'?`<button class="nb sx" onclick=qprv() ${QZ.k?'':'disabled'}>➡ السابق</button>`:'')+(last?'':`<button class="nb sx" onclick=qend()>🏁 إنهاء</button>`)+`<button class="nb sx" onclick=qnx()>${last?'النتيجة 🏁':'التالي ⬅'}</button>`}
function qpick(j){if(QZ.paused||QZ.r[QZ.k]!==undefined)return;const q=QZ.items[QZ.k],ok=j==q.a,z=ok?OK:NO,m=z[Math.random()*z.length|0];
document.querySelectorAll('.op').forEach((e,x)=>{e.disabled=1;if(x==q.a)e.classList.add('ok');else if(x==j)e.classList.add('no')});
QZ.r[QZ.k]={j,ok,m};if(ok){QZ.s++;good();boom()}$('scs').textContent='⭐ '+QZ.s;$('fb').innerHTML=fbH(q,ok,m,j);$('fb').scrollIntoView({behavior:'smooth',block:'nearest'})}
function qnx(){if(QZ.paused)return;if(QZ.k+1<QZ.items.length){QZ.k++;qshow()}else qfin(0)}
function qprv(){if(QZ.paused)return;if(QZ.k>0){QZ.k--;qshow()}}
function qend(){if(QZ.paused)return;if(confirm('هل تريد إنهاء الاختبار الآن وعرض النتيجة؟'))qfin(0)}
function qalarm(){toast('⚠️ تنبيه: تبقّت 10 ثوانٍ فقط!',3000);[0,.22,.44].forEach(t=>tone(1000,t,.15,'square',.3));try{navigator.vibrate&&navigator.vibrate([250,120,250,120,250])}catch(e){}}
function qtick(){const e=$('qt');if(!QZ||!e){clearInterval(QIV);const p=$('pz');p&&p.remove();return}
if(QZ.tm=='none'){e.textContent='';return}
if(QZ.tm=='per'&&QZ.r[QZ.k]){e.textContent='✔';e.className='tmr';return}
if(QZ.paused){e.textContent='⏸ '+qfmt(QZ.rem);e.className='tmr';return}
const ms=QZ.end-Date.now(),rem=Math.max(0,Math.ceil(ms/1000)),low=rem<=10;e.textContent='⏱ '+qfmt(rem);e.className='tmr'+(low?' tw':'');
if(!low)QZ.wn=0;if(low&&rem>0&&QZ.last!==rem){QZ.last=rem;if(!QZ.wn){QZ.wn=1;qalarm()}else tone(rem<=3?990:700,0,.08,'square',.12)}
if(ms<=0)qtime()}
function qtime(){if(QZ.tm=='total'){qfin(1);return}const k=QZ.k;if(QZ.r[k])return;QZ.r[k]={j:-1,ok:false,m:'⏰ انتهى وقت السؤال!',to:1};tone(300,0,.5,'sawtooth',.25);qshow()}
function qpause(){if(QZ.paused)return;if(QZ.tm=='per'&&QZ.r[QZ.k])return toast('الوقت متوقف بعد الإجابة');QZ.rem=Math.max(0,Math.ceil((QZ.end-Date.now())/1000));QZ.paused=1;QZ.ps=Date.now();
const d=document.createElement('div');d.id='pz';d.innerHTML='<div class=mc><h2>⏸ الاختبار متوقف</h2><p style="margin:0">الوقت المتبقي: <b>'+qfmt(QZ.rem)+'</b></p><button class=nx onclick=qresume()>▶ متابعة الاختبار</button></div>';document.body.appendChild(d)}
function qresume(){if(!QZ||!QZ.paused)return;QZ.pms+=Date.now()-QZ.ps;QZ.paused=0;QZ.end=Date.now()+QZ.rem*1000;const p=$('pz');p&&p.remove()}
function qadd(){const a=QZ.tm=='per'?15:60;if(QZ.paused)QZ.rem+=a;else{if(QZ.tm=='per'&&QZ.r[QZ.k])return toast('الوقت متوقف بعد الإجابة');QZ.end+=a*1000}toast('➕ تمت زيادة '+(a==15?'15 ثانية':'دقيقة')+' على الوقت',1800);qtick()}
function qfin(to){clearInterval(QIV);const p=$('pz');p&&p.remove();nv(0);const Q=QZ,n=Q.items.length,s=Q.s,ans=Q.r.filter(x=>x&&x.j>=0).length,pct=Math.round(s/n*100),el=Math.round((Date.now()-Q.t0-Q.pms-(Q.paused?Date.now()-Q.ps:0))/1000);QZ=null;
const bad=Q.items.map((q,i)=>({q,i,r:Q.r[i]})).filter(x=>!(x.r&&x.r.ok));
if(pct>=70){good();boom()}
A.innerHTML=`<div class=card><h2 style="text-align:center">📝 نتيجة اختبر نفسك</h2><div class=big>${pct>=90?'🏆':pct>=70?'⭐':pct>=40?'👍':'📘'}</div><p class=big style="font-size:1.6rem">${s} من ${n} (${pct}%)</p><p class=sub style="text-align:center">${to?'⏰ انتهى وقت الاختبار<br>':''}✔ صحيحة: ${s} · ✖ خاطئة: ${ans-s} · ➖ بلا إجابة: ${n-ans}<br>زمن الاختبار: ${qfmt(el)}</p><div class=row><button class=nx onclick=qgo()>🔁 محاولة جديدة بأسئلة مختلفة</button><button class=sm onclick=qz()>⚙️ تعديل الإعدادات</button><button class=sm onclick=home()>📋 الفهرس</button><button class=sm onclick=intro()>🏡 الواجهة</button></div></div>`+(bad.length?`<div class=card><h3>مراجعة الأسئلة التي لم تُجب عنها صحيحًا (${bad.length})</h3>${bad.map(x=>`<div class="fb r"><p><b>${x.i+1})</b> ${rt(x.q.q)}</p><p>الإجابة الصحيحة: ${rt(x.q.o[x.q.a])}</p><p><b>الشرح:</b> ${rt(x.q.w)}</p></div>`).join('')}</div>`:`<div class=card><p class=msg style="text-align:center">ما شاء الله! كل إجاباتك صحيحة 🎉</p></div>`);scrollTo(0,0)}

intro();
</script>
</body></html>
